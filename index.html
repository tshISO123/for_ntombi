<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for Ntombi ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff5f7;
            overflow: hidden;
            touch-action: manipulation;
        }

        .cursive {
            font-family: 'Dancing Script', cursive;
        }

        #no-button {
            transition: all 0.2s ease;
            z-index: 30;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            pointer-events: none;
            animation: fall 3s linear forwards;
            z-index: 5;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-full m-0 p-4">

    <!-- Initial Question View -->
    <div id="proposal-view" class="text-center z-10 flex flex-col items-center w-full max-w-lg">
        <div class="mb-8 floating">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-24 h-24 md:w-32 md:h-32 text-red-500 fill-current" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        
        <h1 class="text-4xl md:text-6xl text-pink-600 font-bold mb-12 cursive px-4 leading-tight">
            Ntombi, will you be my Valentine?
        </h1>

        <div id="button-container" class="relative flex items-center justify-center gap-6 w-full min-h-[100px]">
            <button id="yes-button" 
                class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 px-10 rounded-full text-xl shadow-lg transition-transform active:scale-95 z-20">
                YES!
            </button>
            
            <button id="no-button" 
                class="bg-white border-2 border-gray-200 text-gray-500 font-bold py-3 px-8 rounded-full text-lg shadow-sm">
                No
            </button>
        </div>
    </div>

    <!-- Celebration View -->
    <div id="celebration-view" class="hidden fixed inset-0 bg-white/95 z-50 flex-col items-center justify-center p-6 text-center overflow-auto">
        <h2 class="text-3xl md:text-5xl text-pink-600 font-bold mb-4 cursive">
            Yay! You made me the luckiest person, Ntombi! ❤️
        </h2>
        <p class="text-pink-400 mb-4 text-sm font-semibold animate-pulse">(The video will play below! ❤️)</p>
        
        <!-- Video Container -->
        <div class="w-full max-w-[320px] rounded-2xl overflow-hidden shadow-2xl border-8 border-pink-100 bg-black aspect-[9/16] relative">
            <video 
                id="main-video"
                class="w-full h-full object-cover"
                playsinline
                loop
                controls>
                <source id="video-source" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <button onclick="window.location.reload()" class="mt-8 text-pink-400 hover:text-pink-600 underline text-sm font-semibold">
            See it again?
        </button>
    </div>

    <script>
        const noBtn = document.getElementById('no-button');
        const yesBtn = document.getElementById('yes-button');
        const proposalView = document.getElementById('proposal-view');
        const celebrationView = document.getElementById('celebration-view');
        const videoElement = document.getElementById('main-video');
        const videoSource = document.getElementById('video-source');

        // DIRECT LINK GENERATED FROM YOUR FILE ID
        const googleDriveDirectLink = 'https://drive.google.com/uc?export=download&id=1eikzNqXQiVlUMh4rSTGXeIe_Jo8mrZA8'; 

        function moveNoButton() {
            noBtn.style.position = 'fixed';
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveNoButton();
        });

        yesBtn.addEventListener('click', () => {
            proposalView.classList.add('hidden');
            celebrationView.classList.remove('hidden');
            celebrationView.classList.add('flex');
            
            // Set video source and load
            if (googleDriveDirectLink) {
                videoSource.src = googleDriveDirectLink;
                videoElement.load();
                
                // Play video
                videoElement.play().catch(e => {
                    console.log("Autoplay with sound blocked, trying muted");
                    videoElement.muted = true;
                    videoElement.play();
                });
            }

            fireConfetti();
            setInterval(createHeart, 300);
        });

        function fireConfetti() {
            const count = 200;
            const defaults = { origin: { y: 0.7 }, colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffffff'] };
            function fire(particleRatio, opts) {
                confetti({ ...defaults, ...opts, particleCount: Math.floor(count * particleRatio) });
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        // Background hearts
        setInterval(createHeart, 2000);
    </script>
</body>
</html>
